name: Node CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - run: npm install

      - run: npm run test
              
      - run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 30000
          curl http://localhost:3000 || exit 1
